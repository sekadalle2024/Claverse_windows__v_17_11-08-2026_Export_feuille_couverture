<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>FullScreen Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #7c6aff;
      --accent-glow: rgba(124,106,255,0.35);
      --accent2: #ff6a8a;
      --accent3: #4ade80;
      --accent4: #38bdf8;
      --text: #e8e8f0;
      --muted: #5a5a72;
    }
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      width: 290px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .bg-mesh {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .bg-mesh::before {
      content:''; position:absolute; width:320px; height:320px;
      background: radial-gradient(circle, rgba(124,106,255,0.1) 0%, transparent 70%);
      top:-120px; left:-60px; animation: d1 9s ease-in-out infinite;
    }
    .bg-mesh::after {
      content:''; position:absolute; width:260px; height:260px;
      background: radial-gradient(circle, rgba(56,189,248,0.07) 0%, transparent 70%);
      bottom:-80px; right:-60px; animation: d2 11s ease-in-out infinite;
    }
    @keyframes d1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,15px)} }
    @keyframes d2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-15px,-20px)} }

    .container { position:relative; z-index:1; padding: 18px; }

    /* Header */
    .header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
    .logo {
      width:36px; height:36px;
      background: linear-gradient(135deg, var(--accent), #5b4fd4);
      border-radius:10px; display:flex; align-items:center; justify-content:center;
      box-shadow: 0 0 20px var(--accent-glow); flex-shrink:0;
    }
    .logo svg { width:18px; height:18px; fill:white; }
    .title-block h1 {
      font-size:15px; font-weight:800; letter-spacing:0.02em;
      background: linear-gradient(90deg,#fff 0%,var(--accent) 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; line-height:1;
    }
    .title-block span {
      font-size:10px; color:var(--muted); font-family:'DM Mono',monospace;
      letter-spacing:.08em; text-transform:uppercase;
    }

    /* Status */
    .status-bar {
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; padding:9px 13px;
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:14px;
    }
    .status-left { display:flex; align-items:center; gap:8px; }
    .status-dot {
      width:7px; height:7px; border-radius:50%;
      background:var(--muted); transition:all .4s;
    }
    .status-dot.active {
      background:var(--accent3);
      box-shadow:0 0 10px rgba(74,222,128,.6);
      animation: pdot 2s ease-in-out infinite;
    }
    @keyframes pdot {
      0%,100%{box-shadow:0 0 6px rgba(74,222,128,.5)}
      50%{box-shadow:0 0 14px rgba(74,222,128,.9)}
    }
    .status-text { font-size:11px; color:var(--muted); font-family:'DM Mono',monospace; transition:color .3s; }
    .status-text.active { color:var(--accent3); }
    .status-badge {
      font-size:9px; font-family:'DM Mono',monospace;
      padding:2px 7px; border-radius:20px;
      background:var(--border); color:var(--muted);
      letter-spacing:.05em; text-transform:uppercase; transition:all .3s;
    }
    .status-badge.active {
      background:rgba(74,222,128,.15); color:var(--accent3);
      border:1px solid rgba(74,222,128,.3);
    }

    /* Section labels */
    .section-label {
      font-size:9px; font-family:'DM Mono',monospace;
      color:var(--muted); letter-spacing:.1em; text-transform:uppercase;
      margin-bottom:8px; padding-left:2px;
    }

    /* Buttons */
    .btn-group { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }

    .btn {
      position:relative; width:100%; padding:12px 16px;
      border:none; border-radius:11px; cursor:pointer;
      font-family:'Syne',sans-serif; font-size:12px; font-weight:700;
      letter-spacing:.04em; transition:all .2s cubic-bezier(.34,1.56,.64,1);
      display:flex; align-items:center; gap:10px; overflow:hidden;
    }
    .btn::before { content:''; position:absolute; inset:0; opacity:0; transition:opacity .2s; }
    .btn:hover::before { opacity:1; }
    .btn:active { transform:scale(0.97); }

    .btn-fullscreen {
      background:linear-gradient(135deg,var(--accent) 0%,#5b4fd4 100%);
      color:white;
      box-shadow:0 4px 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .btn-fullscreen::before { background:linear-gradient(135deg,rgba(255,255,255,.1),transparent); }
    .btn-fullscreen:hover { transform:translateY(-2px); box-shadow:0 8px 30px var(--accent-glow); }

    .btn-exit {
      background:var(--surface); color:var(--text);
      border:1px solid var(--border);
    }
    .btn-exit::before { background:rgba(255,106,138,.08); }
    .btn-exit:hover {
      transform:translateY(-1px); border-color:rgba(255,106,138,.4);
      color:var(--accent2); box-shadow:0 4px 16px rgba(255,106,138,.15);
    }

    .btn-capture-region {
      background:linear-gradient(135deg,#0f2a3f 0%,#0a1a2e 100%);
      color:var(--accent4);
      border:1px solid rgba(56,189,248,.25);
      box-shadow:0 4px 16px rgba(56,189,248,.1);
    }
    .btn-capture-region::before { background:rgba(56,189,248,.07); }
    .btn-capture-region:hover {
      transform:translateY(-2px);
      border-color:rgba(56,189,248,.5);
      box-shadow:0 8px 24px rgba(56,189,248,.2);
    }

    .btn-capture-full {
      background:var(--surface); color:var(--text);
      border:1px solid var(--border);
    }
    .btn-capture-full::before { background:rgba(56,189,248,.06); }
    .btn-capture-full:hover {
      transform:translateY(-1px); border-color:rgba(56,189,248,.3);
      color:var(--accent4); box-shadow:0 4px 14px rgba(56,189,248,.1);
    }

    .btn-icon { width:18px; height:18px; flex-shrink:0; }
    .btn-label { flex:1; text-align:left; }
    .btn-shortcut {
      font-size:9px; font-family:'DM Mono',monospace;
      opacity:.5; letter-spacing:.05em;
      padding:2px 6px; border:1px solid rgba(255,255,255,.1); border-radius:4px;
      flex-shrink:0;
    }

    /* Divider */
    .divider { display:flex; align-items:center; gap:10px; margin:2px 0; }
    .divider-line { flex:1; height:1px; background:var(--border); }
    .divider-text {
      font-size:9px; color:var(--muted);
      font-family:'DM Mono',monospace; letter-spacing:.08em; text-transform:uppercase;
    }

    /* Footer */
    .footer {
      margin-top:12px; padding-top:11px; border-top:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
    }
    .shortcut-hint { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; }
    .shortcut-hint kbd {
      display:inline-block; padding:1px 5px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:4px; font-size:9px; color:var(--text);
    }
    .version { font-size:9px; color:var(--muted); font-family:'DM Mono',monospace; }

    /* Toast */
    .toast {
      position:fixed; bottom:12px; left:50%;
      transform:translateX(-50%) translateY(60px);
      background:var(--surface); border:1px solid var(--border);
      border-radius:20px; padding:7px 14px;
      font-size:11px; font-family:'DM Mono',monospace; color:var(--text);
      white-space:nowrap; transition:transform .4s cubic-bezier(.34,1.56,.64,1);
      z-index:100; pointer-events:none;
    }
    .toast.show { transform:translateX(-50%) translateY(0); }

    /* Ripple */
    @keyframes ripple { to { transform:scale(4); opacity:0; } }
    .ripple-effect {
      position:absolute; border-radius:50%;
      background:rgba(255,255,255,.2);
      animation:ripple .6s linear; pointer-events:none;
      width:20px; height:20px; margin-top:-10px; margin-left:-10px;
    }

    /* Pulse on screenshot btn click */
    @keyframes btnPulse {
      0%,100%{box-shadow:0 4px 16px rgba(56,189,248,.1)}
      50%{box-shadow:0 0 0 4px rgba(56,189,248,.2), 0 4px 20px rgba(56,189,248,.3)}
    }
    .btn-capture-region.pulsing { animation:btnPulse .5s ease; }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="container">

    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M3 3h6v2H5v4H3V3zm12 0h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 4h-4v2h6v-6h-2v4z"/></svg>
      </div>
      <div class="title-block">
        <h1>FullScreen Pro</h1>
        <span>v3.0 · Screen Controller</span>
      </div>
    </div>

    <!-- Status -->
    <div class="status-bar">
      <div class="status-left">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Mode normal</span>
      </div>
      <span class="status-badge" id="statusBadge">INACTIF</span>
    </div>

    <!-- Fullscreen section -->
    <div class="section-label">Plein écran</div>
    <div class="btn-group">
      <button class="btn btn-fullscreen" id="btnFullscreen">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 3h6v2H5v4H3V3zm12 0h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 4h-4v2h6v-6h-2v4z"/>
        </svg>
        <span class="btn-label">Plein Écran</span>
        <span class="btn-shortcut">F11</span>
      </button>
      <button class="btn btn-exit" id="btnExit">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 3v2H5v4H3V3h5zm8 0h5v6h-2V5h-3V3zM3 15h2v4h3v2H3v-6zm13 4h3v-4h2v6h-5v-2z"/>
        </svg>
        <span class="btn-label">Mode normal</span>
        <span class="btn-shortcut">ESC</span>
      </button>
    </div>

    <!-- Screenshot section -->
    <div class="divider"><div class="divider-line"></div><span class="divider-text">capture</span><div class="divider-line"></div></div>
    <br>
    <div class="section-label">Capture d'écran</div>
    <div class="btn-group">
      <button class="btn btn-capture-region" id="btnRegion">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 4a2 2 0 0 1 2-2h4v2H4v4H2V4zm14-2h4a2 2 0 0 1 2 2v4h-2V4h-4V2zM2 16h2v4h4v2H4a2 2 0 0 1-2-2v-4zm18 0h-2v4h-4v2h4a2 2 0 0 0 2-2v-4zM9 8h6v2H9V8zm0 4h6v2H9v-2z"/>
        </svg>
        <span class="btn-label">Sélectionner une zone</span>
        <span class="btn-shortcut">⌃⇧S</span>
      </button>
      <button class="btn btn-capture-full" id="btnCaptureFull">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 2h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v16h16V4H4zm2 2h12v2H6V6zm0 4h12v2H6v-2zm0 4h8v2H6v-2z"/>
        </svg>
        <span class="btn-label">Capturer la page entière</span>
        <span class="btn-shortcut">⌃⇧F</span>
      </button>
    </div>

    <div class="footer">
      <span class="shortcut-hint">Zone : <kbd>Entrée</kbd> ou double-clic</span>
      <span class="version">v3.0.0</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
